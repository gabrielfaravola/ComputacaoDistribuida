syntax = "proto3";

option java_multiple_files = true;
option java_package = "br.mackenzie.biblioteca";
option java_outer_classname = "BibliotecaProto";

package biblioteca;

// ──────────────────────────────────────────────────────────────
// Mensagens de domínio
// ──────────────────────────────────────────────────────────────

message Livro {
  string id     = 1;
  string titulo = 2;
  string autor  = 3;
  int32  ano    = 4;
  string isbn   = 5;
}

message Emprestimo {
  string usuario  = 1;
  string livro_id = 2;
}

message MensagemChat {
  string usuario    = 1;
  string palavra_chave = 2;
}

// ──────────────────────────────────────────────────────────────
// Requisições e respostas
// ──────────────────────────────────────────────────────────────

// 1) Unary – cadastrarLivro
message CadastrarLivroRequest {
  string titulo = 1;
  string autor  = 2;
  int32  ano    = 3;
  string isbn   = 4;
}

message CadastrarLivroResponse {
  string id      = 1;
  string status  = 2;
}

// 2) Server Streaming – listarLivrosPorAutor
message ListarLivrosRequest {
  string autor = 1;
}

// Response: stream de Livro (mensagem reutilizada)

// 3) Client Streaming – registrarEmprestimos
// Request: stream de Emprestimo (mensagem reutilizada)

message ResumoEmprestimos {
  int32  total                    = 1;
  int64  tempo_processamento_ms   = 2;
}

// 4) Bidirectional Streaming – chatBibliotecario
// Request:  stream de MensagemChat (mensagem reutilizada)

message SugestaoLivro {
  string palavra_chave = 1;
  string sugestao      = 2;
  string autor         = 3;
}

// ──────────────────────────────────────────────────────────────
// Serviço
// ──────────────────────────────────────────────────────────────

service BibliotecaService {
  // 1) Unary
  rpc cadastrarLivro (CadastrarLivroRequest) returns (CadastrarLivroResponse);

  // 2) Server Streaming
  rpc listarLivrosPorAutor (ListarLivrosRequest) returns (stream Livro);

  // 3) Client Streaming
  rpc registrarEmprestimos (stream Emprestimo) returns (ResumoEmprestimos);

  // 4) Bidirectional Streaming
  rpc chatBibliotecario (stream MensagemChat) returns (stream SugestaoLivro);
}
